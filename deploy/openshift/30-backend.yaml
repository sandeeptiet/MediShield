apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medishield
  labels: { app: backend }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/medishield/backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: medishield-config }
            - secretRef:    { name: medishield-secrets }
          resources:
            requests: { memory: "1.5Gi", cpu: "500m" }
            limits:   { memory: "3Gi",   cpu: "2" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medishield
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  namespace: medishield
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: medishield
  labels: { app: backend }
spec:
  selector:
    matchLabels: { app: backend }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
