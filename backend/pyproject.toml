[project]
name = "medishield-backend"
version = "0.1.0"
description = "MediShield AI — multi-agent claims intake & triage backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # LLM
    "anthropic>=0.40.0",

    # Agent framework
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.1.140",

    # Database
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "alembic>=1.13.3",

    # Auth
    "google-auth>=2.35.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # OCR / Vision
    "easyocr>=1.7.2",
    "docling>=2.7.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",

    # Embeddings + reranker (local)
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",

    # Vector store
    "qdrant-client>=1.12.0",

    # Classical ML
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",

    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",

    # Settings
    "pydantic>=2.9.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
